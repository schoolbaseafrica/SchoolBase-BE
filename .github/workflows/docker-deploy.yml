name: Docker Deploy Backend

on:
  push:
    branches: [main]
    types: [closed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    
    steps:
      - name: Deploy backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/open-school/openschool-docker/be
            git pull origin main
            cd ..
            
            # Zero-downtime deployment: build new images first
            echo "Building new images..."
            docker-compose build backend-stpaul backend-demo
            
            # Rolling update: update one service at a time
            echo "Updating backend-stpaul..."
            docker-compose up -d --no-deps backend-stpaul
            
            # Wait for service to be healthy
            sleep 15
            
            echo "Updating backend-demo..."
            docker-compose up -d --no-deps backend-demo
            
            # Wait for service to be healthy
            sleep 15
            
            # Clean up old images
            docker image prune -f
            
            echo "Verifying deployment..."
            docker-compose ps backend-stpaul backend-demo