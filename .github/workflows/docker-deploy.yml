name: Docker Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/open-school/openschool-docker/be
            git pull origin main
            cd ..
            
            # Force rebuild and restart services with latest code
            echo "Stopping existing services..."
            docker-compose stop backend-stpaul backend-demo
            
            echo "Removing old containers and images..."
            docker-compose rm -f backend-stpaul backend-demo
            docker image prune -f
            
            echo "Building and starting services with latest code..."
            docker-compose up --build -d backend-stpaul backend-demo
            
            echo "Verifying deployment..."
            docker-compose ps backend-stpaul backend-demo